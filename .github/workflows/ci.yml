name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_MODULES_SCRIPT: |
    go mod tidy
    if ! git diff --quiet go.mod go.sum; then
      echo "::error title=go.mod/go.sum are not tidy::$(git diff -U0 go.mod go.sum | grep -E '^[+-][^+-]' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      exit 1
    fi

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: connecta
          POSTGRES_PASSWORD: connecta
          POSTGRES_DB: connecta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U connecta"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Resolve modules
        run: eval "$GO_MODULES_SCRIPT"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://connecta:connecta@localhost:5432/connecta?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
        run: go test -race -count=1 -v ./... 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Report Go tests
        if: always() && hashFiles('backend/test.log') != ''
        run: echo "::notice title=Go tests::passed $(grep -c -- '--- PASS' test.log), failed $(grep -c -- '--- FAIL' test.log), skipped $(grep -c -- '--- SKIP' test.log)"
      - name: Fail on skipped integration tests
        run: "! grep -q -- '--- SKIP' test.log"

  web:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: connecta
          POSTGRES_PASSWORD: connecta
          POSTGRES_DB: connecta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U connecta"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Resolve Go modules
        working-directory: backend
        run: eval "$GO_MODULES_SCRIPT"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - run: npx tsc --noEmit
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run Playwright
        working-directory: e2e
        env:
          DATABASE_URL: postgres://connecta:connecta@localhost:5432/connecta?sslmode=disable
          REDIS_URL: redis://localhost:6379/1
        run: npx playwright test
      - name: Report E2E
        if: always() && hashFiles('e2e/results.json') != ''
        working-directory: e2e
        run: node -e "const s=require('./results.json').stats;console.log('::notice title=E2E tests::passed '+s.expected+', failed '+s.unexpected+', flaky '+s.flaky+', skipped '+s.skipped)"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Resolve Go modules
        working-directory: backend
        run: eval "$GO_MODULES_SCRIPT"
      - name: Build backend image
        run: docker build -t connecta-backend ./backend
      - name: Build web image
        run: docker build -t connecta-web ./web
      - name: Validate Caddyfile
        run: docker run --rm -e DOMAIN=localhost connecta-web caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
